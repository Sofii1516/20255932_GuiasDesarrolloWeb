<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de pedidos - Cafetería</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/united/bootstrap.min.css" rel="stylesheet"/>
    <script src="../js/pedidos.js" defer></script>
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h1 class="text-center mb-4">Gestión de pedidos de una cafetería</h1>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h5 class="card-title mb-3">Registrar pedido</h5>
          <form id="formPedido" novalidate>
            <div class="row g-3">
              <div class="col-md-5">
                <label for="inputProducto" class="form-label fw-bold">Producto *</label>
                <input type="text" class="form-control" id="inputProducto" placeholder="Café americano" required aria-required="true" />
              </div>
              <div class="col-md-3">
                <label for="inputPrecio" class="form-label fw-bold">Precio unitario ($) *</label>
                <input type="number" step="0.01" class="form-control" id="inputPrecio" placeholder="2.50" required aria-required="true" />
              </div>
              <div class="col-md-2">
                <label for="inputCantidad" class="form-label fw-bold">Cantidad *</label>
                <input type="number" step="1" class="form-control" id="inputCantidad" placeholder="3" required aria-required="true" />
              </div>
              <div class="col-md-2 d-flex align-items-end">
                <button type="button" id="btnAgregar" class="btn btn-primary w-100">Agregar pedido</button>
              </div>
            </div>
            <div id="mensajeError" class="alert alert-danger mt-3 mb-0 d-none" role="alert"></div>
          </form>
        </div>
      </div>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h5 class="card-title mb-3">Filtrar pedidos</h5>
          <div class="row g-3 align-items-end">
            <div class="col-md-4">
              <label for="inputPrecioMax" class="form-label fw-bold">Precio máximo ($)</label>
              <input type="number" step="0.01" class="form-control" id="inputPrecioMax" />
            </div>
            <div class="col-md-8 d-flex flex-wrap gap-2">
              <button type="button" id="btnFiltrar" class="btn btn-secondary">Filtrar productos</button>
              <button type="button" id="btnMostrarTodos" class="btn btn-outline-secondary">Mostrar todos</button>
              <button type="button" id="btnLimpiar" class="btn btn-danger">Limpiar pedidos</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h5 class="card-title mb-3">Pedidos registrados</h5>
          <div class="table-responsive">
            <table class="table table-striped table-bordered align-middle mb-3">
              <thead class="table-dark">
                <tr>
                  <th>Producto</th>
                  <th class="text-end">Precio unitario</th>
                  <th class="text-end">Cantidad</th>
                  <th class="text-end">Subtotal</th>
                </tr>
              </thead>
              <tbody id="tbodyPedidos"></tbody>
            </table>
          </div>
          <div class="d-flex justify-content-end gap-4 fw-bold">
            <span>Total de unidades: <span id="totalUnidades">0</span></span>
            <span>Monto total: $<span id="montoTotal">0.00</span></span>
          </div>
        </div>
      </div>

      <a href="../index.html" class="btn btn-outline-primary">Regresar a Guia 5</a>
      <a href="../../index.html" class="btn btn-outline-primary">Regresar a página principal</a>
    </div>
  </body>
</html>
